<div class="meter" [attr.data-score]="check().score">
  <div class="meter-bar" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <p class="meter-label" aria-live="polite">@if (password) { Força: {{ label() }} }</p>
</div>
<ul class="meter-rules">
  <li [class.is-done]="check().length">8 ou mais caracteres</li>
  <li [class.is-done]="check().uncommon === true">Fora da lista de senhas mais usadas</li>
  <li [class.is-done]="!!password && check().personal">Sem seu nome, e-mail ou prontuário</li>
  <li [class.is-done]="check().varied">Letras com números ou símbolos <span class="meter-optional">(opcional, deixa mais forte)</span></li>
</ul>
