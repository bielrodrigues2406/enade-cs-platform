@if (articulated()) {
  @defer (on immediate) {
    <app-dudu-figure [gesture]="motion" [eyes]="eyes()" [label]="alt()" />
  } @placeholder {
    <img [src]="restSrc()" [alt]="alt()" decoding="async" draggable="false" />
  } @error {
    <img [src]="src()" [alt]="alt()" loading="lazy" decoding="async" draggable="false" />
  }
} @else {
  <img [src]="src()" [alt]="alt()" [class.ready]="imageReady()" (load)="imageReady.set(true)"
    loading="lazy" decoding="async" draggable="false" />
}
