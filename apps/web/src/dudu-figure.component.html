<div class="figure">
  <img class="fallback" [src]="restSrc" alt="" decoding="async" draggable="false" />
  <div class="layers" aria-hidden="true">
    @for (layer of feet; track layer) {
      <img class="layer" [src]="layerSrc(layer)" alt="" decoding="async" draggable="false"
        (load)="layerLoaded(layer, $event)" (error)="layerFailed()" />
    }
    <div class="upper">
      @for (layer of upper; track layer) {
        <img [class]="'layer ' + layer" [src]="layerSrc(layer)" alt="" decoding="async" draggable="false"
          (load)="layerLoaded(layer, $event)" (error)="layerFailed()" />
      }
      <div class="head-group">
        @for (layer of face; track layer) {
          <img [class]="'layer ' + layer" [src]="layerSrc(layer)" alt="" decoding="async" draggable="false"
            (load)="layerLoaded(layer, $event)" (error)="layerFailed()" />
        }
      </div>
    </div>
  </div>
</div>
