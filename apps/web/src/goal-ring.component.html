@if (engagement.state(); as s) {
  <button type="button" class="goal-ring" [class.is-met]="engagement.goalMet()" (click)="open.emit()" [attr.aria-label]="label()">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle class="goal-track" cx="16" cy="16" [attr.r]="radius" />
      <circle class="goal-fill" cx="16" cy="16" [attr.r]="radius" [attr.stroke-dasharray]="length" [attr.stroke-dashoffset]="offset()" />
    </svg>
    <span class="goal-count" aria-hidden="true">{{ s.today < s.goal ? s.today : "✓" }}</span>
    <span class="goal-streak" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 1.6 1.2 2.6 2.5 3 0-3-.5-5.5 0-8z" /></svg>
      {{ s.streak }}
    </span>
  </button>
}
